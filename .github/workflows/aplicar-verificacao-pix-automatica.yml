name: Aplicar verificacao Pix automatica

on:
  push:
    paths:
      - 'scripts/aplicar-verificacao-pix-automatica.js'
      - '.github/workflows/aplicar-verificacao-pix-automatica.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar alteracao
        run: node scripts/aplicar-verificacao-pix-automatica.js
      - name: Validar JavaScript da migracao
        run: node --check scripts/aplicar-verificacao-pix-automatica.js
      - name: Commit da alteracao
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteracao pendente"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Libera Sifia automaticamente apos pagamento Pix"
          git push
