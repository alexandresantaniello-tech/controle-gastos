name: Aplicar UX Importar Extrato

on:
  push:
    paths:
      - 'scripts/aplicar-importar-extrato-ux.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar ajustes de UX
        run: node scripts/aplicar-importar-extrato-ux.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Melhora UX da importação de extrato"
          git push
