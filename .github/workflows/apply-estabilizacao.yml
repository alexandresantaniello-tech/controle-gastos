name: Apply stabilization fixes

on:
  push:
    branches: [fix/estabilizacao-pre-lancamento]

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/estabilizacao-pre-lancamento
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          old="// Temporariamente visivel em qualquer aparelho so pra visualizacao/teste -\n// depois volta a ser so-iOS (ver iPhone|iPad|iPod no user agent).\n{\n  const dicaIphone = document.getElementById('dicaIphone');\n  if (dicaIphone) dicaIphone.style.display = 'block';\n}"
          new="{\n  const dicaIphone = document.getElementById('dicaIphone');\n  const ehIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);\n  if (dicaIphone && ehIOS) dicaIphone.style.display = 'block';\n}"
          assert old in s, 'bloco iOS esperado nao encontrado'
          oldb='clara-backup-${new Date().toISOString().slice(0, 10)}.json'
          assert oldb in s, 'nome antigo do backup nao encontrado'
          s=s.replace(old,new,1).replace(oldb,'sifia-backup-${new Date().toISOString().slice(0, 10)}.json',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          git diff --check
          test "$(git diff --name-only)" = "public/index.html"
          ! grep -q 'clara-backup-' public/index.html
          grep -q 'sifia-backup-' public/index.html
          grep -q 'const ehIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);' public/index.html
          git config user.name 'Sifia Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html
          git commit -m 'fix: stabilize backup name and iOS notice'
          git push origin HEAD:fix/estabilizacao-pre-lancamento
