name: Apply stabilization fixes

on:
  push:
    branches:
      - fix/estabilizacao-pre-lancamento
    paths:
      - .github/workflows/apply-estabilizacao.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/estabilizacao-pre-lancamento
      - name: Apply surgical fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          old_ios = """// Temporariamente visivel em qualquer aparelho so pra visualizacao/teste -
          // depois volta a ser so-iOS (ver iPhone|iPad|iPod no user agent).
          {
            const dicaIphone = document.getElementById('dicaIphone');
            if (dicaIphone) dicaIphone.style.display = 'block';
          }"""
          new_ios = """{
            const dicaIphone = document.getElementById('dicaIphone');
            const ehIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
            if (dicaIphone && ehIOS) dicaIphone.style.display = 'block';
          }"""
          if old_ios not in s:
              raise SystemExit('Bloco iOS esperado nao encontrado; abortando sem alterar.')
          old_backup = 'clara-backup-${new Date().toISOString().slice(0, 10)}.json'
          if old_backup not in s:
              raise SystemExit('Nome antigo do backup nao encontrado; abortando sem alterar.')
          s = s.replace(old_ios, new_ios, 1)
          s = s.replace(old_backup, 'sifia-backup-${new Date().toISOString().slice(0, 10)}.json', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify only intended changes
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "public/index.html"
          ! grep -q 'clara-backup-' public/index.html
          grep -q 'sifia-backup-' public/index.html
          grep -q 'const ehIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);' public/index.html
      - name: Commit fixes
        run: |
          git config user.name 'Sifia Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html
          git commit -m 'fix: stabilize backup name and iOS notice'
          git push origin HEAD:fix/estabilizacao-pre-lancamento
