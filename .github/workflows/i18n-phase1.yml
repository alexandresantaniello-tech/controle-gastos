name: Corrigir internacionalizacao completa

on:
  push:
    branches: [main]
    paths: ['.github/workflows/i18n-phase1.yml']

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Corrigir mecanismo de traducao
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          marker="function mudarIdioma(novo) {\n  if (!NOMES_IDIOMA[novo] || !TRADUCOES[novo]) return;"
          assert marker in s
          helper=r'''
const I18N_UI = {
  pt: {},
  en: {
    'Entrada':'Income','Entradas':'Income','Saída':'Expense','Saídas':'Expenses','Saldo':'Balance',
    'Relatórios':'Reports','Planejamento':'Planning','Backup':'Backup','Idioma':'Language','MOEDA':'CURRENCY',
    'EXCLUIR':'DELETE','ENCERRAR RECORRÊNCIA':'END RECURRENCE','RECORRÊNCIA ENCERRADA':'RECURRENCE ENDED',
    'Observação':'Note','OBSERVAÇÃO':'NOTE','Instituição':'Institution','INSTITUIÇÃO':'INSTITUTION',
    'Forma de pagamento':'Payment method','FORMA DE PAGAMENTO':'PAYMENT METHOD','Local':'Location','LOCAL':'LOCATION',
    'Diário':'Daily','Semanal':'Weekly','Mensal':'Monthly','Trimestral':'Quarterly','Semestral':'Half-yearly','Anual':'Yearly',
    'Transações':'Transactions','Por forma de pagamento':'By payment method','Transações do período':'Period transactions','Fechar':'Close'
  },
  es: {
    'Entrada':'Ingreso','Entradas':'Ingresos','Saída':'Gasto','Saídas':'Gastos','Saldo':'Saldo',
    'Relatórios':'Informes','Planejamento':'Planificación','Backup':'Copia de seguridad','Idioma':'Idioma','MOEDA':'MONEDA',
    'EXCLUIR':'ELIMINAR','ENCERRAR RECORRÊNCIA':'FINALIZAR RECURRENCIA','RECORRÊNCIA ENCERRADA':'RECURRENCIA FINALIZADA',
    'Observação':'Observación','OBSERVAÇÃO':'OBSERVACIÓN','Instituição':'Institución','INSTITUIÇÃO':'INSTITUCIÓN',
    'Forma de pagamento':'Forma de pago','FORMA DE PAGAMENTO':'FORMA DE PAGO','Local':'Lugar','LOCAL':'LUGAR',
    'Diário':'Diario','Semanal':'Semanal','Mensal':'Mensual','Trimestral':'Trimestral','Semestral':'Semestral','Anual':'Anual',
    'Transações':'Transacciones','Por forma de pagamento':'Por forma de pago','Transações do período':'Transacciones del período','Fechar':'Cerrar'
  }
};
function traduzirTextoInterface(texto) {
  let out=String(texto == null ? '' : texto);
  const dic=I18N_UI[idiomaSelecionado] || {};
  Object.entries(dic).sort((a,b)=>b[0].length-a[0].length).forEach(([pt,tr])=>{ out=out.split(pt).join(tr); });
  return out;
}
function aplicarTraducaoProfunda() {
  if (idiomaSelecionado==='pt') return;
  const walker=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  const nos=[]; while(walker.nextNode()) nos.push(walker.currentNode);
  nos.forEach(no=>{
    const pai=no.parentElement;
    if (!pai || ['SCRIPT','STYLE','TEXTAREA','INPUT'].includes(pai.tagName)) return;
    if (pai.closest('.nota') || pai.closest('.detalhes') || pai.closest('#confLocal') || pai.closest('#confInstituicao')) return;
    no.nodeValue=traduzirTextoInterface(no.nodeValue);
  });
  document.querySelectorAll('input[placeholder]').forEach(el=>el.placeholder=traduzirTextoInterface(el.placeholder));
}
'''
          s=s.replace(marker,helper+'\n'+marker,1)
          old="  aplicarTraducoes();\n  renderizar();\n}"
          assert old in s
          s=s.replace(old,"  aplicarTraducoes();\n  renderizar();\n  aplicarTraducaoProfunda();\n}",1)
          init="aplicarTraducoes();\nrenderizar();\ncarregarTaxasCambio().then(() => {"
          assert init in s
          s=s.replace(init,"aplicarTraducoes();\nrenderizar();\naplicarTraducaoProfunda();\ncarregarTaxasCambio().then(() => {",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar JavaScript
        run: |
          python3 - <<'PY'
          import re
          s=open('public/index.html',encoding='utf-8').read()
          assert 'aplicarTraducaoProfunda' in s
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          open('/tmp/sifia.js','w',encoding='utf-8').write('\n'.join(scripts))
          PY
          node --check /tmp/sifia.js
      - name: Publicar na main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'fix: aplica idioma em toda interface dinamica'
          git push origin main
