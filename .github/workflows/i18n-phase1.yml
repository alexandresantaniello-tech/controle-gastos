name: Ajuste menu idioma

on:
  push:
    branches: [main]
    paths: ['.github/workflows/i18n-phase1.yml']

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ajustar menu
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.toggles-linha { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 0; margin-bottom: 14px; scroll-margin-top: 16px; }','.toggles-linha { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 0; margin-bottom: 14px; scroll-margin-top: 16px; }',1)
          s=s.replace('    flex: 0 1 98px;\n    justify-content: center;','    width: 100%;\n    min-width: 0;\n    min-height: 44px;\n    justify-content: center;',1)
          s=s.replace('''  <p class="aviso-backup" id="idiomaNativoInfo"></p>\n  <button class="secondary" id="btnIdiomaNativo" onclick="restaurarIdiomaNativo()" style="width:100%; margin-bottom:12px;"></button>\n  <button onclick="escolherIdioma()" style="width:100%;">🌐 Escolher outro idioma</button>''','''  <button onclick="escolherIdioma()" style="width:100%;">🌐 Escolher idioma</button>''',1)
          s,n=re.subn(r'\nfunction detectarIdiomaNativo\(\) \{.*?\nasync function escolherIdioma\(\) \{','\nasync function escolherIdioma() {',s,count=1,flags=re.S)
          assert n == 1
          s=s.replace('\natualizarCardIdioma();\nrenderizar();','\nrenderizar();',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q 'grid-template-columns: repeat(3, minmax(0, 1fr))' public/index.html
          grep -q 'Escolher idioma' public/index.html
          if grep -q 'restaurarIdiomaNativo' public/index.html; then exit 1; fi
          if grep -q 'idiomaNativoDispositivo' public/index.html; then exit 1; fi
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'fix: padroniza seis botoes e remove idioma nativo'
          git push origin main
