name: Build Sifia iOS Prototype

on:
  push:
    branches: [ios-share-extension]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Install Share Extension into Xcode project
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          app = project.targets.find { |t| t.name == 'App' }
          ext = project.new_target(:app_extension, 'SifiaShare', :ios, app.deployment_target)
          group = project.main_group.new_group('SifiaShare', 'SifiaShare')
          FileUtils.mkdir_p('ios/App/SifiaShare')
          FileUtils.cp('ios-share/ShareViewController.swift', 'ios/App/SifiaShare/ShareViewController.swift')
          FileUtils.cp('ios-share/Info.plist', 'ios/App/SifiaShare/Info.plist')
          swift = group.new_file('ShareViewController.swift')
          group.new_file('Info.plist')
          ext.add_file_references([swift])
          ext.build_configurations.each do |c|
            c.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.sifia.app.share'
            c.build_settings['PRODUCT_NAME'] = 'SifiaShare'
            c.build_settings['WRAPPER_EXTENSION'] = 'appex'
            c.build_settings['INFOPLIST_FILE'] = 'SifiaShare/Info.plist'
          c.build_settings['GENERATE_INFOPLIST_FILE'] = 'NO'
            c.build_settings['SWIFT_VERSION'] = '5.0'
            c.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
          end
          app.add_dependency(ext)
          embed = app.copy_files_build_phases.find { |p| p.name == 'Embed App Extensions' } || app.new_copy_files_build_phase('Embed App Extensions')
          embed.dst_subfolder_spec = '13'
          build_file = embed.add_file_reference(ext.product_reference, true)
          build_file.settings = { 'ATTRIBUTES' => ['RemoveHeadersOnCopy'] }
          project.save
          RUBY
      - name: Build simulator app without signing
        run: |
          rm -rf build-simulator Sifia-simulator.zip
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build-simulator CODE_SIGNING_ALLOWED=NO build
          SIM_APP="build-simulator/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$SIM_APP"
          test -d "$SIM_APP/PlugIns/SifiaShare.appex"
          ditto -c -k --sequesterRsrc --keepParent "$SIM_APP" Sifia-simulator.zip
          unzip -l Sifia-simulator.zip | grep -E 'App.app/|SifiaShare.appex' | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: sifia-ios-simulator-app
          path: Sifia-simulator.zip
      - name: Build unsigned device app for remote-device packaging
        run: |
          rm -rf build-device Payload Sifia-unsigned.ipa
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphoneos -configuration Debug -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP_PATH="build-device/Build/Products/Debug-iphoneos/App.app"
          test -d "$APP_PATH"
          test -d "$APP_PATH/PlugIns/SifiaShare.appex"
          mkdir Payload
          cp -R "$APP_PATH" Payload/Sifia.app
          zip -qry Sifia-unsigned.ipa Payload
          unzip -l Sifia-unsigned.ipa | grep -E 'Payload/Sifia.app/|SifiaShare.appex' | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: sifia-ios-unsigned-ipa
          path: Sifia-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: sifia-ios-generated
          path: ios/
