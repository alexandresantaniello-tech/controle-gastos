<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Gastos</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<meta name="theme-color" content="#0f1115">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f1115;
    color: #e8e8ea;
    margin: 0;
    padding: 16px;
    max-width: 720px;
    margin-inline: auto;
  }
  @media (min-width: 480px) {
    body { padding: 24px; }
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.subtitle { color: #9a9aa2; margin-top: 0; font-size: 0.9rem; }
  .card {
    background: #1a1d24;
    border: 1px solid #2a2e37;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  button {
    background: #5b8cff;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 12px;
  }
  button:disabled { background: #3a3f4b; cursor: not-allowed; }
  button.secondary { background: transparent; border: 1px solid #3a3f4b; color: #e8e8ea; }
  .summary { display: flex; gap: 12px; flex-wrap: wrap; }
  .summary .box { flex: 1; min-width: 140px; background: #1a1d24; border: 1px solid #2a2e37; border-radius: 12px; padding: 16px; }
  .summary .box .label { font-size: 0.8rem; color: #9a9aa2; }
  .summary .box .value { font-size: 1.3rem; font-weight: 600; margin-top: 4px; }
  .entrada { color: #4ade80; }
  .saida { color: #f87171; }
  .transacao {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #2a2e37;
  }
  .transacao:last-child { border-bottom: none; }
  .transacao .info { min-width: 0; flex: 1; }
  .transacao .linha-topo { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .transacao .valor { font-size: 1.05rem; font-weight: 600; }
  .transacao .detalhes {
    font-size: 0.8rem;
    color: #9a9aa2;
    margin-top: 2px;
    overflow-wrap: break-word;
  }
  .status { font-size: 0.85rem; color: #9a9aa2; margin-top: 8px; min-height: 1.2em; }
  .status.error { color: #f87171; }
  .empty { color: #9a9aa2; text-align: center; padding: 20px; font-size: 0.9rem; }
  .row-actions {
    cursor: pointer;
    color: #9a9aa2;
    flex-shrink: 0;
    padding: 4px 8px;
    font-size: 1.1rem;
  }
  .row-actions:hover { color: #f87171; }
  .mes-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .mes-nav button.nav {
    background: #1a1d24;
    border: 1px solid #2a2e37;
    color: #e8e8ea;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    padding: 0;
    margin: 0;
    font-size: 1rem;
    line-height: 1;
  }
  .mes-nav .titulo { font-size: 1.05rem; font-weight: 600; text-transform: capitalize; }
  .grupo-dia {
    font-size: 0.75rem;
    color: #9a9aa2;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 16px 0 4px;
  }
  .grupo-dia:first-child { margin-top: 0; }
</style>
</head>
<body>

<h1>Controle de Gastos</h1>
<p class="subtitle">Compartilhe o comprovante, sem conectar sua conta bancária. Tudo fica salvo só neste navegador.</p>

<div class="mes-nav">
  <button class="nav" onclick="mudarMes(-1)">‹</button>
  <div class="titulo" id="tituloMes">-</div>
  <button class="nav" onclick="mudarMes(1)">›</button>
</div>

<div class="summary">
  <div class="box">
    <div class="label">Entradas</div>
    <div class="value entrada" id="totalEntradas">R$ 0,00</div>
  </div>
  <div class="box">
    <div class="label">Saídas</div>
    <div class="value saida" id="totalSaidas">R$ 0,00</div>
  </div>
  <div class="box">
    <div class="label">Saldo</div>
    <div class="value" id="saldo">R$ 0,00</div>
  </div>
</div>

<div class="card">
  <div id="listaTransacoes"></div>
  <div class="empty" id="emptyMsg">Nenhuma transação neste mês.</div>
</div>

<script>
const STORAGE_KEY = 'controle_gastos_transacoes';
const NOMES_MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const hoje = new Date();
let mesSelecionado = hoje.getMonth();
let anoSelecionado = hoje.getFullYear();

function parseData(dataStr) {
  if (!dataStr) return null;
  const m = dataStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  return { dia: parseInt(m[1], 10), mes: parseInt(m[2], 10) - 1, ano: parseInt(m[3], 10) };
}

function mudarMes(delta) {
  mesSelecionado += delta;
  if (mesSelecionado > 11) { mesSelecionado = 0; anoSelecionado++; }
  if (mesSelecionado < 0) { mesSelecionado = 11; anoSelecionado--; }
  renderizar();
}

function carregarTransacoes() {
  const raw = localStorage.getItem(STORAGE_KEY);
  return raw ? JSON.parse(raw) : [];
}

function salvarTransacoes(lista) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
}

function adicionarTransacao(dados) {
  const lista = carregarTransacoes();
  lista.unshift({ ...dados, id: Date.now() });
  salvarTransacoes(lista);
  renderizar();
}

function removerTransacao(id) {
  const lista = carregarTransacoes().filter(t => t.id !== id);
  salvarTransacoes(lista);
  renderizar();
}

function formatarMoeda(valor) {
  return 'R$ ' + Number(valor || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
}

function renderizarTransacao(t) {
  const div = document.createElement('div');
  div.className = 'transacao';
  div.innerHTML = `
    <div class="info">
      <div class="linha-topo">
        <span class="${t.tipo === 'entrada' ? 'entrada' : 'saida'}">${t.tipo === 'entrada' ? 'Entrada' : 'Saída'}</span>
        <span class="valor">${formatarMoeda(t.valor)}</span>
      </div>
      <div class="detalhes">${t.data || '-'} · ${t.instituicao || '-'} · ${t.local || '-'}</div>
    </div>
    <div class="row-actions" onclick="removerTransacao(${t.id})">✕</div>
  `;
  return div;
}

function renderizar() {
  const todas = carregarTransacoes();
  const container = document.getElementById('listaTransacoes');
  const emptyMsg = document.getElementById('emptyMsg');
  container.innerHTML = '';

  document.getElementById('tituloMes').textContent = `${NOMES_MESES[mesSelecionado]} de ${anoSelecionado}`;

  // Transações sem data reconhecida aparecem em todo mês, pra nunca ficarem escondidas
  const doMes = todas.filter(t => {
    const d = parseData(t.data);
    if (!d) return true;
    return d.mes === mesSelecionado && d.ano === anoSelecionado;
  });

  // Ordena por dia (mais recente primeiro); sem data reconhecida fica por último
  doMes.sort((a, b) => {
    const da = parseData(a.data), db = parseData(b.data);
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return db.dia - da.dia;
  });

  if (doMes.length === 0) {
    emptyMsg.style.display = 'block';
  } else {
    emptyMsg.style.display = 'none';
    let diaAtual = null;
    doMes.forEach(t => {
      const d = parseData(t.data);
      const chaveDia = d ? String(d.dia) : 'sem-data';
      if (chaveDia !== diaAtual) {
        diaAtual = chaveDia;
        const header = document.createElement('div');
        header.className = 'grupo-dia';
        header.textContent = d ? `Dia ${d.dia}` : 'Data não identificada';
        container.appendChild(header);
      }
      container.appendChild(renderizarTransacao(t));
    });
  }

  const totalEntradas = doMes.filter(t => t.tipo === 'entrada').reduce((s, t) => s + Number(t.valor || 0), 0);
  const totalSaidas = doMes.filter(t => t.tipo === 'saida').reduce((s, t) => s + Number(t.valor || 0), 0);

  document.getElementById('totalEntradas').textContent = formatarMoeda(totalEntradas);
  document.getElementById('totalSaidas').textContent = formatarMoeda(totalSaidas);
  document.getElementById('saldo').textContent = formatarMoeda(totalEntradas - totalSaidas);
}

renderizar();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
