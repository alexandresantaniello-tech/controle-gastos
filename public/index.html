<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Gastos</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<meta name="theme-color" content="#0f1115">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f1115;
    color: #e8e8ea;
    margin: 0;
    padding: 16px;
    max-width: 720px;
    margin-inline: auto;
  }
  @media (min-width: 480px) {
    body { padding: 24px; }
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.subtitle { color: #9a9aa2; margin-top: 0; font-size: 0.9rem; }
  .card {
    background: #1a1d24;
    border: 1px solid #2a2e37;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .upload-toggle {
    color: #9a9aa2;
    font-size: 0.85rem;
    cursor: pointer;
    margin-bottom: 16px;
    display: inline-block;
  }
  .upload-toggle:hover { color: #5b8cff; }
  .drop-zone {
    border: 2px dashed #3a3f4b;
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: #5b8cff; }
  .drop-zone input { display: none; }
  #preview { max-width: 100%; max-height: 160px; border-radius: 8px; margin-top: 12px; display: none; }
  button {
    background: #5b8cff;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 12px;
  }
  button:disabled { background: #3a3f4b; cursor: not-allowed; }
  button.secondary { background: transparent; border: 1px solid #3a3f4b; color: #e8e8ea; }
  .summary { display: flex; gap: 12px; flex-wrap: wrap; }
  .summary .box { flex: 1; min-width: 140px; background: #1a1d24; border: 1px solid #2a2e37; border-radius: 12px; padding: 16px; }
  .summary .box .label { font-size: 0.8rem; color: #9a9aa2; }
  .summary .box .value { font-size: 1.3rem; font-weight: 600; margin-top: 4px; }
  .entrada { color: #4ade80; }
  .saida { color: #f87171; }
  .transacao {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #2a2e37;
  }
  .transacao:last-child { border-bottom: none; }
  .transacao .info { min-width: 0; flex: 1; }
  .transacao .linha-topo { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .transacao .valor { font-size: 1.05rem; font-weight: 600; }
  .transacao .detalhes {
    font-size: 0.8rem;
    color: #9a9aa2;
    margin-top: 2px;
    overflow-wrap: break-word;
  }
  .status { font-size: 0.85rem; color: #9a9aa2; margin-top: 8px; min-height: 1.2em; }
  .status.error { color: #f87171; }
  .empty { color: #9a9aa2; text-align: center; padding: 20px; font-size: 0.9rem; }
  .row-actions {
    cursor: pointer;
    color: #9a9aa2;
    flex-shrink: 0;
    padding: 4px 8px;
    font-size: 1.1rem;
  }
  .row-actions:hover { color: #f87171; }
  .mes-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .mes-nav button.nav {
    background: #1a1d24;
    border: 1px solid #2a2e37;
    color: #e8e8ea;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    padding: 0;
    margin: 0;
    font-size: 1rem;
    line-height: 1;
  }
  .mes-nav .titulo { font-size: 1.05rem; font-weight: 600; text-transform: capitalize; }
  .grupo-dia {
    font-size: 0.75rem;
    color: #9a9aa2;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 16px 0 4px;
  }
  .grupo-dia:first-child { margin-top: 0; }
  .periodo-tipos { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .periodo-tipos button {
    background: #1a1d24;
    border: 1px solid #2a2e37;
    color: #9a9aa2;
    font-size: 0.8rem;
    padding: 6px 12px;
    margin: 0;
    border-radius: 20px;
  }
  .periodo-tipos button.ativo { background: #5b8cff; border-color: #5b8cff; color: white; }
  .relatorio-acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .relatorio-acoes button { flex: 1; min-width: 140px; }
  .relatorio-resumo-linha { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.9rem; border-bottom: 1px solid #2a2e37; }
  .relatorio-resumo-linha:last-child { border-bottom: none; }
</style>
</head>
<body>

<h1>Controle de Gastos</h1>
<p class="subtitle">Compartilhe o comprovante, sem conectar sua conta bancária. Tudo fica salvo só neste navegador.</p>

<div class="upload-toggle" id="uploadToggle" onclick="alternarUpload()">+ Adicionar manualmente</div>

<div class="card" id="uploadCard" style="display:none;">
  <div class="drop-zone" id="dropZone">
    <div id="dropText">Clique ou arraste o print/PDF do comprovante aqui (ou Ctrl+V)</div>
    <img id="preview">
    <input type="file" id="fileInput" accept="image/*,application/pdf">
  </div>
  <button id="sendBtn" disabled>Analisar comprovante</button>
  <div class="status" id="status"></div>
</div>

<div class="mes-nav">
  <button class="nav" onclick="mudarMes(-1)">‹</button>
  <div class="titulo" id="tituloMes">-</div>
  <button class="nav" onclick="mudarMes(1)">›</button>
</div>

<div class="summary">
  <div class="box">
    <div class="label">Entradas</div>
    <div class="value entrada" id="totalEntradas">R$ 0,00</div>
  </div>
  <div class="box">
    <div class="label">Saídas</div>
    <div class="value saida" id="totalSaidas">R$ 0,00</div>
  </div>
  <div class="box">
    <div class="label">Saldo</div>
    <div class="value" id="saldo">R$ 0,00</div>
  </div>
</div>

<div class="card">
  <div id="listaTransacoes"></div>
  <div class="empty" id="emptyMsg">Nenhuma transação neste mês.</div>
</div>

<div class="upload-toggle" id="relatorioToggle" onclick="alternarRelatorio()">📊 Relatórios</div>

<div class="card" id="relatorioCard" style="display:none;">
  <div class="periodo-tipos" id="periodoTipos"></div>
  <div class="mes-nav">
    <button class="nav" onclick="mudarPeriodo(-1)">‹</button>
    <div class="titulo" id="tituloPeriodo">-</div>
    <button class="nav" onclick="mudarPeriodo(1)">›</button>
  </div>
  <div id="resumoRelatorio"></div>
  <div class="relatorio-acoes">
    <button onclick="compartilharResumo()">Compartilhar resumo</button>
    <button class="secondary" onclick="compartilharCsv()">Compartilhar planilha (CSV)</button>
  </div>
  <div class="status" id="statusRelatorio"></div>
</div>

<script>
const STORAGE_KEY = 'controle_gastos_transacoes';
const NOMES_MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const hoje = new Date();
let mesSelecionado = hoje.getMonth();
let anoSelecionado = hoje.getFullYear();

function parseData(dataStr) {
  if (!dataStr) return null;
  const m = dataStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  return { dia: parseInt(m[1], 10), mes: parseInt(m[2], 10) - 1, ano: parseInt(m[3], 10) };
}

function mudarMes(delta) {
  mesSelecionado += delta;
  if (mesSelecionado > 11) { mesSelecionado = 0; anoSelecionado++; }
  if (mesSelecionado < 0) { mesSelecionado = 11; anoSelecionado--; }
  renderizar();
}

const TIPOS_PERIODO = [
  { chave: 'dia', label: 'Diário' },
  { chave: 'semana', label: 'Semanal' },
  { chave: 'mes', label: 'Mensal' },
  { chave: 'trimestre', label: 'Trimestral' },
  { chave: 'semestre', label: 'Semestral' },
  { chave: 'ano', label: 'Anual' },
];
let tipoPeriodo = 'mes';
let ancoraPeriodo = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());

function dataDaTransacao(t) {
  const d = parseData(t.data);
  if (!d) return null;
  return new Date(d.ano, d.mes, d.dia);
}

function calcularIntervalo(tipo, ancora) {
  const ano = ancora.getFullYear();
  const mes = ancora.getMonth();
  const dia = ancora.getDate();

  if (tipo === 'dia') {
    const inicio = new Date(ano, mes, dia);
    const fim = new Date(ano, mes, dia);
    return { inicio, fim, label: inicio.toLocaleDateString('pt-BR') };
  }
  if (tipo === 'semana') {
    const diaSemana = ancora.getDay();
    const inicio = new Date(ano, mes, dia - diaSemana);
    const fim = new Date(ano, mes, dia - diaSemana + 6);
    return { inicio, fim, label: `${inicio.toLocaleDateString('pt-BR')} – ${fim.toLocaleDateString('pt-BR')}` };
  }
  if (tipo === 'mes') {
    const inicio = new Date(ano, mes, 1);
    const fim = new Date(ano, mes + 1, 0);
    return { inicio, fim, label: `${NOMES_MESES[mes]} de ${ano}` };
  }
  if (tipo === 'trimestre') {
    const q = Math.floor(mes / 3);
    const inicio = new Date(ano, q * 3, 1);
    const fim = new Date(ano, q * 3 + 3, 0);
    return { inicio, fim, label: `${q + 1}º trimestre de ${ano}` };
  }
  if (tipo === 'semestre') {
    const s = Math.floor(mes / 6);
    const inicio = new Date(ano, s * 6, 1);
    const fim = new Date(ano, s * 6 + 6, 0);
    return { inicio, fim, label: `${s + 1}º semestre de ${ano}` };
  }
  // ano
  const inicio = new Date(ano, 0, 1);
  const fim = new Date(ano, 11, 31);
  return { inicio, fim, label: `${ano}` };
}

function mudarPeriodo(delta) {
  const passos = { dia: 1, semana: 7, mes: 0, trimestre: 0, semestre: 0, ano: 0 };
  if (tipoPeriodo === 'dia' || tipoPeriodo === 'semana') {
    ancoraPeriodo.setDate(ancoraPeriodo.getDate() + delta * passos[tipoPeriodo]);
  } else if (tipoPeriodo === 'mes') {
    ancoraPeriodo.setMonth(ancoraPeriodo.getMonth() + delta);
  } else if (tipoPeriodo === 'trimestre') {
    ancoraPeriodo.setMonth(ancoraPeriodo.getMonth() + delta * 3);
  } else if (tipoPeriodo === 'semestre') {
    ancoraPeriodo.setMonth(ancoraPeriodo.getMonth() + delta * 6);
  } else if (tipoPeriodo === 'ano') {
    ancoraPeriodo.setFullYear(ancoraPeriodo.getFullYear() + delta);
  }
  renderizarRelatorio();
}

function selecionarTipoPeriodo(tipo) {
  tipoPeriodo = tipo;
  renderizarRelatorio();
}

function transacoesDoPeriodo() {
  const { inicio, fim } = calcularIntervalo(tipoPeriodo, ancoraPeriodo);
  return carregarTransacoes().filter(t => {
    const d = dataDaTransacao(t);
    if (!d) return false;
    return d >= inicio && d <= fim;
  });
}

function renderizarRelatorio() {
  const tiposEl = document.getElementById('periodoTipos');
  tiposEl.innerHTML = TIPOS_PERIODO.map(tp =>
    `<button class="${tp.chave === tipoPeriodo ? 'ativo' : ''}" onclick="selecionarTipoPeriodo('${tp.chave}')">${tp.label}</button>`
  ).join('');

  const { label } = calcularIntervalo(tipoPeriodo, ancoraPeriodo);
  document.getElementById('tituloPeriodo').textContent = label;

  const transacoes = transacoesDoPeriodo();
  const totalEntradas = transacoes.filter(t => t.tipo === 'entrada').reduce((s, t) => s + Number(t.valor || 0), 0);
  const totalSaidas = transacoes.filter(t => t.tipo === 'saida').reduce((s, t) => s + Number(t.valor || 0), 0);

  document.getElementById('resumoRelatorio').innerHTML = `
    <div class="relatorio-resumo-linha"><span>Transações</span><strong>${transacoes.length}</strong></div>
    <div class="relatorio-resumo-linha"><span>Entradas</span><strong class="entrada">${formatarMoeda(totalEntradas)}</strong></div>
    <div class="relatorio-resumo-linha"><span>Saídas</span><strong class="saida">${formatarMoeda(totalSaidas)}</strong></div>
    <div class="relatorio-resumo-linha"><span>Saldo</span><strong>${formatarMoeda(totalEntradas - totalSaidas)}</strong></div>
  `;
}

function textoResumoRelatorio() {
  const { label } = calcularIntervalo(tipoPeriodo, ancoraPeriodo);
  const transacoes = transacoesDoPeriodo();
  const totalEntradas = transacoes.filter(t => t.tipo === 'entrada').reduce((s, t) => s + Number(t.valor || 0), 0);
  const totalSaidas = transacoes.filter(t => t.tipo === 'saida').reduce((s, t) => s + Number(t.valor || 0), 0);
  const tipoLabel = TIPOS_PERIODO.find(tp => tp.chave === tipoPeriodo).label;

  let texto = `Relatório ${tipoLabel} — ${label}\n\n`;
  texto += `Transações: ${transacoes.length}\n`;
  texto += `Entradas: ${formatarMoeda(totalEntradas)}\n`;
  texto += `Saídas: ${formatarMoeda(totalSaidas)}\n`;
  texto += `Saldo: ${formatarMoeda(totalEntradas - totalSaidas)}\n`;
  return texto;
}

function gerarCsv() {
  const transacoes = transacoesDoPeriodo();
  let csv = 'Data,Tipo,Valor,Instituicao,Local\n';
  transacoes.forEach(t => {
    const linha = [t.data || '', t.tipo || '', t.valor || 0, t.instituicao || '', t.local || '']
      .map(campo => `"${String(campo).replace(/"/g, '""')}"`)
      .join(',');
    csv += linha + '\n';
  });
  return csv;
}

async function compartilharResumo() {
  const texto = textoResumoRelatorio();
  const statusEl = document.getElementById('statusRelatorio');
  if (navigator.share) {
    try {
      await navigator.share({ title: 'Relatório - Controle de Gastos', text: texto });
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
    }
  }
  await navigator.clipboard.writeText(texto);
  statusEl.textContent = 'Resumo copiado (compartilhamento direto não disponível neste navegador).';
}

async function compartilharCsv() {
  const csv = gerarCsv();
  const { label } = calcularIntervalo(tipoPeriodo, ancoraPeriodo);
  const nomeArquivo = `gastos-${label.replace(/[^\w]+/g, '-')}.csv`;
  const statusEl = document.getElementById('statusRelatorio');
  const arquivo = new File([csv], nomeArquivo, { type: 'text/csv' });

  if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
    try {
      await navigator.share({ files: [arquivo], title: 'Planilha de gastos' });
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
    }
  }
  await navigator.clipboard.writeText(csv);
  statusEl.textContent = 'CSV copiado como texto (compartilhamento de arquivo não disponível neste navegador).';
}

function alternarRelatorio() {
  const card = document.getElementById('relatorioCard');
  const toggle = document.getElementById('relatorioToggle');
  const abrindo = card.style.display === 'none';
  card.style.display = abrindo ? 'block' : 'none';
  toggle.textContent = abrindo ? '– Fechar relatórios' : '📊 Relatórios';
  if (abrindo) renderizarRelatorio();
}

function alternarUpload() {
  const card = document.getElementById('uploadCard');
  const toggle = document.getElementById('uploadToggle');
  const abrindo = card.style.display === 'none';
  card.style.display = abrindo ? 'block' : 'none';
  toggle.textContent = abrindo ? '– Fechar' : '+ Adicionar manualmente';
}

let imagemSelecionada = null;
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const dropText = document.getElementById('dropText');
const sendBtn = document.getElementById('sendBtn');
const status = document.getElementById('status');
const TEXTO_PADRAO_DROPZONE = 'Clique ou arraste o print/PDF do comprovante aqui (ou Ctrl+V)';

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});
document.addEventListener('paste', (e) => {
  const items = e.clipboardData.items;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      handleFile(item.getAsFile());
      break;
    }
  }
});

function handleFile(file) {
  imagemSelecionada = file;
  if (file.type === 'application/pdf') {
    preview.style.display = 'none';
    dropText.textContent = '📄 ' + file.name;
  } else {
    const reader = new FileReader();
    reader.onload = (e) => {
      preview.src = e.target.result;
      preview.style.display = 'block';
      dropText.textContent = file.name;
    };
    reader.readAsDataURL(file);
  }
  sendBtn.disabled = false;
  status.textContent = '';
  status.className = 'status';
}

sendBtn.addEventListener('click', async () => {
  if (!imagemSelecionada) return;
  sendBtn.disabled = true;
  status.textContent = 'Analisando comprovante...';
  status.className = 'status';

  const formData = new FormData();
  formData.append('receipt', imagemSelecionada);

  try {
    const resp = await fetch('/api/parse-receipt', { method: 'POST', body: formData });
    const dados = await resp.json();

    if (dados.erro) {
      status.textContent = 'Erro: ' + dados.erro;
      status.className = 'status error';
      sendBtn.disabled = false;
      return;
    }

    adicionarTransacao(dados);
    resetForm();
    status.textContent = 'Transação adicionada com sucesso.';
    setTimeout(alternarUpload, 1200);
  } catch (err) {
    status.textContent = 'Erro de conexão com o servidor.';
    status.className = 'status error';
    sendBtn.disabled = false;
  }
});

function resetForm() {
  imagemSelecionada = null;
  preview.style.display = 'none';
  preview.src = '';
  dropText.textContent = TEXTO_PADRAO_DROPZONE;
  fileInput.value = '';
  sendBtn.disabled = true;
}

function carregarTransacoes() {
  const raw = localStorage.getItem(STORAGE_KEY);
  return raw ? JSON.parse(raw) : [];
}

function salvarTransacoes(lista) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
}

function adicionarTransacao(dados) {
  const lista = carregarTransacoes();
  lista.unshift({ ...dados, id: Date.now() });
  salvarTransacoes(lista);
  renderizar();
}

function removerTransacao(id) {
  const lista = carregarTransacoes().filter(t => t.id !== id);
  salvarTransacoes(lista);
  renderizar();
}

function formatarMoeda(valor) {
  return 'R$ ' + Number(valor || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
}

function renderizarTransacao(t) {
  const div = document.createElement('div');
  div.className = 'transacao';
  div.innerHTML = `
    <div class="info">
      <div class="linha-topo">
        <span class="${t.tipo === 'entrada' ? 'entrada' : 'saida'}">${t.tipo === 'entrada' ? 'Entrada' : 'Saída'}</span>
        <span class="valor">${formatarMoeda(t.valor)}</span>
      </div>
      <div class="detalhes">${t.data || '-'} · ${t.instituicao || '-'} · ${t.local || '-'}</div>
    </div>
    <div class="row-actions" onclick="removerTransacao(${t.id})">✕</div>
  `;
  return div;
}

function renderizar() {
  const todas = carregarTransacoes();
  const container = document.getElementById('listaTransacoes');
  const emptyMsg = document.getElementById('emptyMsg');
  container.innerHTML = '';

  document.getElementById('tituloMes').textContent = `${NOMES_MESES[mesSelecionado]} de ${anoSelecionado}`;

  // Transações sem data reconhecida aparecem em todo mês, pra nunca ficarem escondidas
  const doMes = todas.filter(t => {
    const d = parseData(t.data);
    if (!d) return true;
    return d.mes === mesSelecionado && d.ano === anoSelecionado;
  });

  // Ordena por dia (mais recente primeiro); sem data reconhecida fica por último
  doMes.sort((a, b) => {
    const da = parseData(a.data), db = parseData(b.data);
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return db.dia - da.dia;
  });

  if (doMes.length === 0) {
    emptyMsg.style.display = 'block';
  } else {
    emptyMsg.style.display = 'none';
    let diaAtual = null;
    doMes.forEach(t => {
      const d = parseData(t.data);
      const chaveDia = d ? String(d.dia) : 'sem-data';
      if (chaveDia !== diaAtual) {
        diaAtual = chaveDia;
        const header = document.createElement('div');
        header.className = 'grupo-dia';
        header.textContent = d ? `Dia ${d.dia}` : 'Data não identificada';
        container.appendChild(header);
      }
      container.appendChild(renderizarTransacao(t));
    });
  }

  const totalEntradas = doMes.filter(t => t.tipo === 'entrada').reduce((s, t) => s + Number(t.valor || 0), 0);
  const totalSaidas = doMes.filter(t => t.tipo === 'saida').reduce((s, t) => s + Number(t.valor || 0), 0);

  document.getElementById('totalEntradas').textContent = formatarMoeda(totalEntradas);
  document.getElementById('totalSaidas').textContent = formatarMoeda(totalSaidas);
  document.getElementById('saldo').textContent = formatarMoeda(totalEntradas - totalSaidas);
}

renderizar();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
